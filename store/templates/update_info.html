{% extends 'base.html' %}
{% block content %}

<!-- Header-->
    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder">Actualizar informacion de usuario</h1>
                <p class="lead fw-normal text-white-50 mb-0">Actualiza tu informacion de usuario.</p>
            </div>
        </div>
    </header>
    <div class="container">
        <div class="row">
                <div class="col-md-6 offset-md-3">
                    <br/><br/>

                    <strong> Factura </strong>

                    <br/><br/>
                    <form method="POST" action="{% url 'update_info' %}">
                        {% csrf_token %}
                        
                        {{form.as_p}}
                        <br/><br/>
                        <strong> Datos de Envío</strong>
                        <br/><br/>
                        {{shipping_form.as_p}}

                        <br/><br/>
                        <button type="submit" class="btn btn-secondary"> Actualizar </button>
                    </form>
                    <br/><br/>
                    <br/><br/><br/>
                    

                </div>
        </div>
    </div>

{% endblock %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Compra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .confirmation-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2, h3 {
            color: #333;
        }
        .thank-you {
            font-size: 24px;
            margin-bottom: 10px;
            color: #007bff;
        }
        .payment-success {
            font-size: 18px;
            margin-bottom: 20px;
            color: #555;
        }
        .order-number {
            font-size: 20px;
            margin-bottom: 15px;
            color: #007bff;
        }
        .order-summary-title {
            font-size: 18px;
            margin-top: 20px;
            border-top: 2px solid #ddd;
            padding-top: 10px;
            color: #333;
        }
        .order-summary ul {
            list-style-type: none;
            padding: 0;
        }
        .order-summary li {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .order-summary li:last-child {
            border-bottom: none;
        }
        .total-price {
            font-weight: bold;
            margin-top: 10px;
        }
        .shipping-info {
            margin-top: 20px;
        }
        .shipping-info p {
            margin: 5px 0;
        }
        .track-link {
            display: inline-block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }
        .track-link:hover {
            text-decoration: underline;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 20px 0;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .offers, .resources, .related-products {
            margin-top: 20px;
        }
        .offers p, .resources p, .related-products p {
            font-size: 16px;
        }
        .resources a, .related-products a {
            color: #007bff;
            text-decoration: none;
        }
        .resources a:hover, .related-products a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <h1 class="thank-you">¡Gracias por tu compra!</h1>
        <p class="payment-success">Tu pago fue exitoso</p>

        <h3 class="order-summary-title">Resumen del Pedido:</h3>
        <div class="order-summary">
            <ul>
                {% for product in cart_products %}
            </ul>
            <p class="total-price">Total: ${totals}</p>
        </div>

        <a href="{% url 'home' %}" class="button">Seguir Comprando</a>
    </div>
</body>
</html>
